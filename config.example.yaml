# DataHub_SWFP 运行配置示例（敏感信息不要进代码/不要提交真实值）
#
# 用法：
#   cp config.example.yaml config.yaml
#   go run ./cmd/relay
#
# 仅 SWFP 路由：
#   POST /v1/openapi/zlx/querySrmxSWFP
#   GET  /v1/openapi/zlx/quotaSWFP

addr: ":8080"

upstream:
  timeout: "4s"

billing:
  requeryInterval: "10s"

admin:
  bootstrapUser: "admin"
  bootstrapPass: "REPLACE_WITH_ADMIN_PASSWORD"
  jwtSecret: "REPLACE_WITH_ADMIN_JWT_SECRET"
  tokenTTL: "8h"
  spaDir: "web/admin/dist"

demo:
  appSecret: "REPLACE_WITH_DEMO_APP_SECRET"
  seed: false

storage:
  driver: "memory"
  migrationsDir: "migrations"

pg_base: &pg_base
  host: "REPLACE_WITH_PG_HOST"
  port: 5432
  user: "REPLACE_WITH_PG_ADMIN_USER"
  password: "REPLACE_WITH_PG_ADMIN_PASSWORD"
  sslmode: "disable"
  maxConns: 10

redis_base: &redis_base
  addr: "REPLACE_WITH_REDIS_HOST:6379"
  username: "REPLACE_WITH_REDIS_ADMIN_USER"
  password: "REPLACE_WITH_REDIS_ADMIN_PASSWORD"
  poolSize: 10

versions:
  swfp:
    upstreams:
      - kind: "entcredit"
        label: "invoice1"
        product: "P0130081"
        baseURL: "REPLACE_WITH_SWFP_UPSTREAM_ENDPOINT"
        orgCode: "REPLACE_WITH_SWFP_ORG_CODE"
        accessKeyId: "REPLACE_WITH_SWFP_ACCESS_KEY_ID"
        secretAccessKey: "REPLACE_WITH_SWFP_SECRET_ACCESS_KEY"
      - kind: "entcredit"
        label: "invoice2"
        product: "P0130083"
        baseURL: "REPLACE_WITH_SWFP_UPSTREAM_ENDPOINT"
        orgCode: "REPLACE_WITH_SWFP_ORG_CODE"
        accessKeyId: "REPLACE_WITH_SWFP_ACCESS_KEY_ID"
        secretAccessKey: "REPLACE_WITH_SWFP_SECRET_ACCESS_KEY"
      - kind: "entcredit"
        label: "tax1"
        product: "P0130082"
        baseURL: "REPLACE_WITH_SWFP_UPSTREAM_ENDPOINT"
        orgCode: "REPLACE_WITH_SWFP_ORG_CODE"
        accessKeyId: "REPLACE_WITH_SWFP_ACCESS_KEY_ID"
        secretAccessKey: "REPLACE_WITH_SWFP_SECRET_ACCESS_KEY"
      - kind: "entcredit"
        label: "tax2"
        product: "P0130084"
        baseURL: "REPLACE_WITH_SWFP_UPSTREAM_ENDPOINT"
        orgCode: "REPLACE_WITH_SWFP_ORG_CODE"
        accessKeyId: "REPLACE_WITH_SWFP_ACCESS_KEY_ID"
        secretAccessKey: "REPLACE_WITH_SWFP_SECRET_ACCESS_KEY"
      - kind: "salesdata"
        label: "sales"
        optional: true
        baseURL: "http://api2.crestv.com:32313/api/ws"
        appId: "REPLACE_WITH_SALESDATA_APP_ID"
        appSecret: "REPLACE_WITH_SALESDATA_APP_KEY"
    database:
      <<: *pg_base
      name: "datahub_swfp_db"
    redis:
      <<: *redis_base
      db: 5
